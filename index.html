<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Predict-Then-Optimize · Dutch PhD Proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style/index.css">
</head>
<body>

<nav id="topnav">
  <div class="brand"><em>Predict-Then-Optimize</em> &middot; Dutch PhD Proposal</div>
  <div class="tabs">
    <button class="tab t1 active" onclick="show(1)">Track 1 &middot; Energy</button>
    <button class="tab t2"        onclick="show(2)">Track 2 &middot; Hospital</button>
    <button class="tab t3"        onclick="show(3)">Track 3 &middot; Logistics</button>
  </div>
</nav>

<div id="frame-wrap">
  <iframe id="f1" src="track1.html" class="active" title="Track 1 Energy"></iframe>
  <iframe id="f2" src="track2.html" title="Track 2 Hospital"></iframe>
  <iframe id="f3" src="track3.html" title="Track 3 Logistics"></iframe>
</div>

<script>
function show(n) {
  document.querySelectorAll('iframe').forEach((f, i) => f.classList.toggle('active', i+1===n));
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i+1===n));
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Predict-Then-Optimise · Maastricht PhD Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EE;--surface:#FBF9F5;--border:#E5E0D8;
  --text:#1C1917;--muted:#78716C;
  --orange:#D4540A;--teal:#0C7A91;--amber:#B45309;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'Inter',-apple-system,sans-serif;overflow:hidden;height:100vh;display:flex;flex-direction:column}

#topnav{
  flex-shrink:0;height:54px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;z-index:100;
}
.brand{font-family:'Playfair Display',serif;font-size:14px;color:var(--muted);white-space:nowrap}
.brand em{font-style:italic;color:var(--text)}

.tabs{display:flex;gap:4px}
.tab{
  background:none;border:1px solid var(--border);border-radius:6px;
  padding:6px 16px;font-size:12px;font-weight:500;cursor:pointer;
  font-family:'Inter',sans-serif;color:var(--muted);transition:all .2s;white-space:nowrap;
}
.tab:hover{border-color:var(--text);color:var(--text)}
.tab.t1.active{background:var(--orange);border-color:var(--orange);color:#fff}
.tab.t2.active{background:var(--teal);border-color:var(--teal);color:#fff}
.tab.t3.active{background:var(--amber);border-color:var(--amber);color:#fff}

#frame-wrap{flex:1;position:relative;overflow:hidden}
iframe{
  position:absolute;inset:0;width:100%;height:100%;
  border:none;opacity:0;pointer-events:none;transition:opacity .3s;
}
iframe.active{opacity:1;pointer-events:auto}
</style>
</head>
<body>

<nav id="topnav">
  <div class="brand"><em>Predict-Then-Optimise</em> &middot; Maastricht PhD Demo</div>
  <div class="tabs">
    <button class="tab t1 active" onclick="show(1)">Core Case &middot; Energy</button>
    <button class="tab t2"        onclick="show(2)">Transfer Case &middot; Hospital</button>
    <button class="tab t3"        onclick="show(3)">Transfer Case &middot; Logistics</button>
  </div>
</nav>

<div id="frame-wrap">
  <iframe id="f1" src="track1.html" class="active" title="Track 1 Energy"></iframe>
  <iframe id="f2" src="track2.html" title="Track 2 Hospital"></iframe>
  <iframe id="f3" src="track3.html" title="Track 3 Logistics"></iframe>
</div>

<script>
function show(n) {
  document.querySelectorAll('iframe').forEach((f, i) => f.classList.toggle('active', i+1===n));
  document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i+1===n));
}
</script>
</body>
</html>
